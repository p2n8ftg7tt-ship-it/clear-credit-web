  status = 404
  force = true

[[redirects]]
  from = "/_papelera/*"
  to = "/index.html"
  status = 404
  force = true

# Copias de trabajo y borradores: se quedan en tu computadora para las IAs,
# pero nadie puede verlas ni descargarlas desde el sitio publicado.
# (Netlify compara la ruta ya decodificada, así que el espacio va literal.)
[[redirects]]
  from = "/Claude outputs/*"
  to = "/index.html"
  status = 404
  force = true

# Las pruebas automáticas (node --test tests/) son de tu computadora, no del sitio
[[redirects]]
  from = "/tests/*"
  to = "/index.html"
  status = 404
  force = true

# La propia carpeta, si alguien la pide sin archivo dentro
[[redirects]]
  from = "/Claude outputs"
  to = "/index.html"
  status = 404
  force = true

# Variante con el espacio codificado, por si acaso
[[redirects]]
  from = "/Claude%20outputs/*"
  to = "/index.html"
  status = 404
  force = true

# Todo lo que está en la raíz se publica. Estas carpetas y notas son de trabajo
# (especificaciones, herramientas de IA, mapa del código, instrucciones internas):
# se quedan en tu computadora y en GitHub, pero nadie las descarga del sitio.
